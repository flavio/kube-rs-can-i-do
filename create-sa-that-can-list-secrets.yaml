apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo1
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: list-secrets
  namespace: default
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo1-can-list-secrets
  namespace: default
subjects:
- kind: ServiceAccount
  name: demo1
  namespace: default
roleRef:
  kind: Role
  name: list-secrets
  apiGroup: rbac.authorization.k8s.io

